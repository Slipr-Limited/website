# Render blueprint for the Slipr website and admin panel (a static site).
# Create it from this file: Render dashboard → New → Blueprint → select this repo.

services:
  - type: web
    name: slipr-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Read at build time by Vite. Points the admin panel at the API.
      - key: VITE_API_URL
        value: https://backend-2-e4i7.onrender.com
      - key: VITE_APP_NAME
        value: Slipr
    routes:
      # Single-page app: every path that isn't a file serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The admin panel is never indexed, framed, or cached.
      - path: /admin
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /admin
        name: X-Frame-Options
        value: DENY
      - path: /admin
        name: Referrer-Policy
        value: no-referrer
      - path: /admin
        name: Cache-Control
        value: no-store, max-age=0
      - path: /admin
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://backend-2-e4i7.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /admin/*
        name: X-Frame-Options
        value: DENY
      - path: /admin/*
        name: Referrer-Policy
        value: no-referrer
      - path: /admin/*
        name: Cache-Control
        value: no-store, max-age=0
      - path: /admin/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://backend-2-e4i7.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
